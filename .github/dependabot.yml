version: 2

# Keep the three npm projects independent, matching their lockfiles and deploys.
# Routine minor/patch releases are grouped; major version updates stay separate.
# Security updates have their own groups and do not wait for the weekly schedule.
# All PRs need review and passing checks; this file does not enable auto-merge.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /eval
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    groups:
      eval-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      eval-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
